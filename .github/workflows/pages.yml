name: Publicar demonstração no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos estáticos
        run: |
          mkdir -p _site
          cp index.html _site/index.html
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar demonstração
        id: deployment
        uses: actions/deploy-pages@v4
